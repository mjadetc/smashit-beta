spring.application.name=smashit-backend

# ---------- database ----------
# Locally these come from backend/.env; on Render they are environment variables.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# NEW in step 8: at most 5 database connections. Neon's free plan allows a limited
# number, and a beta needs far fewer than the default 10.
spring.datasource.hikari.maximum-pool-size=5

spring.jpa.hibernate.ddl-auto=none
# CHANGED in step 8: printing every SQL query is handy locally but noisy on a server.
# ${NAME:default} = use the environment variable NAME, or the default if it isn't set.
spring.jpa.show-sql=${SHOW_SQL:true}

spring.flyway.enabled=true


# ---------- web server ----------
# NEW in step 8: Render tells the app which port to listen on in the PORT variable.
server.port=${PORT:8080}


# ---------- session cookie security settings ----------

# Prevent JavaScript from reading the session cookie.
# This helps protect the session from being stolen through XSS.
server.servlet.session.cookie.http-only=true

# CHANGED in step 8: false for local HTTP development; Render sets COOKIE_SECURE=true,
# so the browser only sends the cookie over HTTPS.
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}

# Restrict when the browser sends the session cookie.
server.servlet.session.cookie.same-site=lax

# NEW in step 8: stay logged in for 12 hours without activity (the default is 30 minutes,
# too short for an organizer who puts the phone away between matches).
server.servlet.session.timeout=12h


# ---------- sessions in the database (NEW in step 8) ----------
# Flyway creates the tables (V12), so Spring Session must not try to create them itself.
spring.session.jdbc.initialize-schema=never
# Delete expired sessions once an hour (the default is every minute, which would keep
# Neon's free database awake all the time).
spring.session.jdbc.cleanup-cron=0 0 * * * *


# ---------- CORS (NEW in step 8) ----------
# Which websites may call this API from the browser, separated by commas.
# Locally: Vite. On Render: CORS_ALLOWED_ORIGINS=https://your-app.vercel.app
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}


# Read the DB_URL / DB_USERNAME / DB_PASSWORD values from the .env file next to pom.xml.
# Spring Boot doesn't do this by itself; the [.properties] part says "read it like a
# .properties file" (KEY=value lines). "optional:" = don't crash if the file is missing,
# e.g. on the server later, where these values are set as real environment variables.
spring.config.import=optional:file:.env[.properties]